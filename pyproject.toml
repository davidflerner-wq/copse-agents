[project]
name = "grove"
version = "0.1.0"
description = "Orchestrate CLI coding agents in tmux, each on its own git worktree and branch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "mcp>=2.2,<3",
]

[project.scripts]
grove = "grove.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grove"]

[tool.pytest.ini_options]
testpaths = ["tests"]
